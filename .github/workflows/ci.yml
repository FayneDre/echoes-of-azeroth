name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace + UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: UI type-check, catalog schema, i18n parity
        run: npm run check

      - name: Build UI (required by tauri::generate_context!)
        run: npm run build --workspace app

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: MySQL version (for the rk-db integration tests)
        id: mysql
        shell: bash
        run: echo "key=$(node -p 'const c=require("./catalog/components/mysql-8-4.json"); c.version + "-" + c.platforms["windows-x86_64"].sha256')" >> "$GITHUB_OUTPUT"

      - name: Cache MySQL
        uses: actions/cache@v6
        with:
          path: C:\tools\mysql\current
          key: ci-mysql-${{ steps.mysql.outputs.key }}

      - name: Fetch MySQL (pinned sha256)
        shell: pwsh
        run: ./tools/ci/fetch-mysql.ps1 -Manifest catalog/components/mysql-8-4.json -Destination 'C:\tools\mysql\current'

      - name: tests (incl. real MySQL lifecycle)
        env:
          RK_MYSQL_BASEDIR: C:\tools\mysql\current
        run: cargo test --workspace --locked

      - name: Catalog cross-reference validation
        run: cargo run --locked -p rk-cli -- catalog validate

      # The debug app with its WebView2 debugging port open, driven over the
      # DevTools protocol on an empty data root (nothing is installed).
      - name: Build the debug app for the UI smoke test
        working-directory: app
        run: |
          node ../tools/ci/ui-smoke.mjs config ../target/ui-smoke.tauri.json
          npx tauri build --debug --no-bundle --config ../target/ui-smoke.tauri.json

      - name: UI smoke test
        run: node tools/ci/ui-smoke.mjs run --exe target/debug/realmkeeper.exe --shots target/ui-smoke-shots

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-shots
          path: target/ui-smoke-shots
          if-no-files-found: ignore
          retention-days: 7

  linux-core:
    name: Linux (portable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: tests (core crates only, keeps them portable)
        run: cargo test --locked -p rk-core -p rk-catalog -p rk-conf -p rk-db -p rk-engine -p rk-store -p rk-launcher -p rk-cli
