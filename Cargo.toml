[workspace]
resolver = "2"
members = ["crates/*", "drivers/*", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90" # tauri-plugin-opener 2.7
authors = ["RealmKeeper contributors"]
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/FayneDre/realmkeeper"

[workspace.dependencies]
# Internal crates
rk-core = { path = "crates/rk-core" }
rk-catalog = { path = "crates/rk-catalog" }
rk-store = { path = "crates/rk-store" }
rk-engine = { path = "crates/rk-engine" }
rk-conf = { path = "crates/rk-conf" }
rk-db = { path = "crates/rk-db" }
rk-runtime = { path = "crates/rk-runtime" }
rk-client = { path = "crates/rk-client" }
rk-launcher = { path = "crates/rk-launcher" }
rk-driver-azerothcore = { path = "drivers/azerothcore" }

# External crates
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Index signatures (ADR 0010): pure Rust, strict RFC 8032 verification.
ed25519-dalek = "3"
getrandom = "0.3"
# SRP6 account registration (AzerothCore driver).
num-bigint = "0.5"
regex = "1"
sha1 = "0.11"
futures-util = "0.3"
# Free disk space before downloads and unpacking (pure Rust, no libc).
fs4 = "1.1"
hex = "0.4"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
windows-sys = "0.61"
# Directory links without privileges (server data overlay, ADR 0013).
junction = "2"
# Module assets shipped as .7z archives (pure Rust, decoding only).
sevenz-rust2 = { version = "0.25", default-features = false }
# Job Objects: supervised processes that hold no state die with the launcher.
win32job = "2"
# Pure-Rust deflate (zlib-rs): no C toolchain, fast decoding.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
