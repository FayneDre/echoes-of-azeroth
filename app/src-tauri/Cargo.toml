[package]
name = "realmkeeper"
description = "RealmKeeper desktop launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "realmkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rk-client.workspace = true
rk-core.workspace = true
rk-engine.workspace = true
rk-launcher.workspace = true
rk-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
] }
