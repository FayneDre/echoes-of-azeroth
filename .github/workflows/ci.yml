name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace + UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: UI type-check, catalog schema, i18n parity
        run: npm run check

      - name: Build UI (required by tauri::generate_context!)
        run: npm run build --workspace app

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --workspace --locked

      - name: Catalog cross-reference validation
        run: cargo run --locked -p eoa-cli -- catalog validate

  linux-core:
    name: Linux (portable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: tests (core crates only, keeps them portable)
        run: cargo test --locked -p eoa-core -p eoa-catalog -p eoa-conf -p eoa-store -p eoa-cli
