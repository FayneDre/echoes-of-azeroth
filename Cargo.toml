[workspace]
resolver = "2"
members = ["crates/*", "drivers/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90" # tauri-plugin-opener 2.7
authors = ["Echoes of Azeroth contributors"]
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/FayneDre/echoes-of-azeroth"

[workspace.dependencies]
# Internal crates
eoa-core = { path = "crates/eoa-core" }
eoa-catalog = { path = "crates/eoa-catalog" }
eoa-store = { path = "crates/eoa-store" }
eoa-engine = { path = "crates/eoa-engine" }
eoa-conf = { path = "crates/eoa-conf" }
eoa-db = { path = "crates/eoa-db" }
eoa-runtime = { path = "crates/eoa-runtime" }
eoa-client = { path = "crates/eoa-client" }
eoa-launcher = { path = "crates/eoa-launcher" }
eoa-driver-azerothcore = { path = "drivers/azerothcore" }

# External crates
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Index signatures (ADR 0010): pure Rust, strict RFC 8032 verification.
ed25519-dalek = "3"
getrandom = "0.3"
# SRP6 account registration (AzerothCore driver).
num-bigint = "0.5"
regex = "1"
sha1 = "0.11"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14"
# Directory links without privileges (server data overlay, ADR 0013).
junction = "2"
# Module assets shipped as .7z archives (pure Rust, decoding only).
sevenz-rust2 = { version = "0.25", default-features = false }
# Job Objects: supervised processes that hold no state die with the launcher.
win32job = "2"
# Pure-Rust deflate (zlib-rs): no C toolchain, fast decoding.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
